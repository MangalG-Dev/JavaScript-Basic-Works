<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors in JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navigation">
        <nav>
            <div class="body">
                <ul>
                    <li><a href="Calculator/index.html" target="_blank">Calculator</a></li>
                    <li><a href="Currency Converter/index.html" target="_blank">Currency Converter</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <h1>Rock Paper Scissors</h1>

    <!-- <div class="highscore">  
        <p>Leaderboard</p>
        <ol id="leadboard-list"></ol>
    </div> -->

    <div class="game">
        <div class="choices">
            <div class="choice" id="rock">
                <img src="Assets/Rock.jpg" />
            </div>
            <div class="choice" id="paper">
                <img src="Assets/Paper.jpg" />
            </div>
            <div class="choice" id="scissor">
                <img src="Assets/Scissor.jpg" />
            </div>
        </div>

        <div class="score-board">
            <div class="score">
                <p id="user-score">0</p>
                <p>You</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>Comp</p>
            </div>
        </div>
        
        <div class="msg-container">
            <p id="msg">Play Your Move</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
