<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
    name="description"
    content="Find bank IFSC codes, branch details, bank address, city and state using our free IFSC Code Finder.">
    <title>IFSC Code Finder - Find Bank IFSC Code Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <div class="navigation">
        <nav>
            <div class="body">
                <ul>
                    <li><a href="Calculator/index.html" target="_blank">Calculator</a></li>
                    <li><a href="Currency Converter/index.html" target="_blank">Currency Converter</a></li>
                    <li><a href="Rock, Paper, Scissor/index.html" target="_blank">Rock Paper Scissor</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="container">

        <div class="app-container">

            <!-- Main Search Card -->
            <div class="card search-card p-4">

                <div class="text-center mb-4">
                    <h1 class="app-title">🏦 IFSC Code Finder</h1>
                    <p class="text-muted">
                        Find bank branch details using bank and branch name
                    </p>
                </div>

                <!-- Bank Input -->
                <div class="mb-3">
                    <label for="bank" class="form-label">
                        Bank Name
                    </label>

                    <input
                        type="text"
                        id="bank"
                        class="form-control form-control-lg"
                        placeholder="Example: ICICI"
                    oninput="this.value = this.value.toUpperCase()"
                    >

                </div>

                <!-- Branch Input -->
                <div class="mb-3">
                    <label for="branch" class="form-label">
                        Branch Name / Location
                    </label>

                    <input
                        type="text"
                        id="branch"
                        class="form-control form-control-lg"
                        placeholder="Example: Connaught Place Delhi"
                    >
                </div>

                <!-- Search Button -->
                <button
                    id="searchBtn"
                    class="btn btn-primary w-100 search-btn"
                    onclick="getIFSC()"
                >
                    Search IFSC
                </button>

                <!-- Loading -->
                <div
                    id="loading"
                    class="text-center mt-4 d-none"
                >
                    <div
                        class="spinner-border text-primary"
                        role="status"
                    ></div>

                    <p class="mt-2 text-muted">
                        Searching...
                    </p>
                </div>

                <!-- Error -->
                <div
                    id="errorMessage"
                    class="alert alert-danger mt-4 d-none"
                ></div>

            </div>


            <!-- Result Card -->
            <div
                id="resultCard"
                class="card result-card shadow-sm mt-4 p-4 d-none"
            >

                <h3 class="mb-3">
                    🏦 Bank Details
                </h3>

                <div class="result-item">
                    <div class="result-label">
                        Bank
                    </div>

                    <div id="resultBank">
                        -
                    </div>
                </div>

                <div class="result-item">
                    <div class="result-label">
                        Branch
                    </div>

                    <div id="resultBranch">
                        -
                    </div>
                </div>

                <div class="result-item">
                    <div class="result-label">
                        IFSC Code
                    </div>

                    <div
                        id="resultIFSC"
                        class="ifsc-code text-primary"
                    >
                        -
                    </div>
                </div>

                <div class="result-item">
                    <div class="result-label">
                        Address
                    </div>

                    <div id="resultAddress">
                        -
                    </div>
                </div>

                <div class="result-item">
                    <div class="result-label">
                        City
                    </div>

                    <div id="resultCity">
                        -
                    </div>
                </div>

                <div class="result-item">
                    <div class="result-label">
                        State
                    </div>

                    <div id="resultState">
                        -
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="ifsc.js"></script>
</body>
</html>
